<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="t d">
  <title id="t">audio-tag</title>
  <desc id="d">Spec-exact audio tags for MP3, M4A, FLAC, Ogg, AIFF and WAV. Zero dependencies, browser and Node, byte-exact round trips.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="tag" x1="8" y1="12" x2="58" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  </style>
  <rect width="960" height="300" rx="20" fill="url(#bg)"/>

  <!-- a quiet waveform in the top right -->
  <g fill="url(#wave)" opacity="0.32">
    <rect x="740" y="98" width="8" height="44" rx="4"/><rect x="756" y="80" width="8" height="80" rx="4"/>
    <rect x="772" y="60" width="8" height="120" rx="4"/><rect x="788" y="88" width="8" height="64" rx="4"/>
    <rect x="804" y="70" width="8" height="100" rx="4"/><rect x="820" y="44" width="8" height="152" rx="4"/>
    <rect x="836" y="76" width="8" height="88" rx="4"/><rect x="852" y="94" width="8" height="52" rx="4"/>
    <rect x="868" y="66" width="8" height="108" rx="4"/><rect x="884" y="86" width="8" height="68" rx="4"/>
    <rect x="900" y="104" width="8" height="32" rx="4"/>
  </g>

  <!-- the icon -->
  <g transform="translate(40 40) scale(2)">
    <path fill="url(#tag)" fill-rule="evenodd" d="M23 12H52a7 7 0 0 1 7 7V45a7 7 0 0 1-7 7H23a3 3 0 0 1-2.2-1L6.6 35.4a5 5 0 0 1 0-6.8L20.8 13a3 3 0 0 1 2.2-1ZM16.5 32a3.8 3.8 0 1 0 7.6 0 3.8 3.8 0 1 0-7.6 0Z"/>
    <g fill="#fff">
      <rect x="29" y="25" width="4.5" height="14" rx="2.25"/><rect x="36" y="19" width="4.5" height="26" rx="2.25"/>
      <rect x="43" y="23" width="4.5" height="18" rx="2.25"/><rect x="50" y="27.5" width="4.5" height="9" rx="2.25"/>
    </g>
  </g>

  <text x="186" y="112" class="sans" font-size="56" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">audio-tag</text>
  <text x="188" y="150" class="sans" font-size="20" fill="#cbd5e1">Spec-exact tags for every audio container</text>

  <!-- the six formats, each in its own color -->
  <g class="sans" font-size="14" font-weight="600" text-anchor="middle">
    <rect x="188" y="174" width="104" height="30" rx="15" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6"/>
    <text x="240" y="194" fill="#93c5fd">MP3 · ID3</text>
    <rect x="302" y="174" width="104" height="30" rx="15" fill="#8b5cf6" fill-opacity="0.18" stroke="#8b5cf6"/>
    <text x="354" y="194" fill="#c4b5fd">M4A · MP4</text>
    <rect x="416" y="174" width="70" height="30" rx="15" fill="#10b981" fill-opacity="0.18" stroke="#10b981"/>
    <text x="451" y="194" fill="#6ee7b7">FLAC</text>
    <rect x="496" y="174" width="62" height="30" rx="15" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b"/>
    <text x="527" y="194" fill="#fcd34d">Ogg</text>
    <rect x="568" y="174" width="70" height="30" rx="15" fill="#ec4899" fill-opacity="0.18" stroke="#ec4899"/>
    <text x="603" y="194" fill="#f9a8d4">AIFF</text>
    <rect x="648" y="174" width="66" height="30" rx="15" fill="#06b6d4" fill-opacity="0.18" stroke="#06b6d4"/>
    <text x="681" y="194" fill="#67e8f9">WAV</text>
  </g>

  <line x1="40" y1="236" x2="920" y2="236" stroke="#334155"/>
  <g class="mono" font-size="14" fill="#94a3b8">
    <text x="40" y="266"><tspan fill="#e2e8f0">0</tspan> dependencies</text>
    <text x="214" y="266">browser · Node · Deno · Bun</text>
    <text x="478" y="266">byte-exact round trips</text>
    <text x="700" y="266"><tspan fill="#e2e8f0">104</tspan> ID3v2 frames</text>
  </g>
</svg>
