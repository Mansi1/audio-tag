# Deploys the website to GitHub Pages (https://mansi1.github.io/audio-tag/) on every push to main.
# The site is website/dist/, built by defuss-ssg (Node 22+) from website/ after the library build; its URLs
# are page-relative, so it works as is under /audio-tag/.
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - run: npm ci
      - run: cd website && bun install --frozen-lockfile
      - run: npm run build
      - run: npm run site
      - run: touch website/dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
