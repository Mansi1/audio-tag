# Deploys the website to GitHub Pages (https://mansi1.github.io/audio-tag/) after the verify workflow passes on
# main. It deploys website/dist/ from the npm tarball that verify packed and `make e2e` installed and drove in
# Chromium (the `package` artifact), so the site that goes live is the one the test saw, never built again; a
# commit that fails verify never goes live. The site's URLs are page-relative, so it works as is under
# /audio-tag/. A manual run deploys the latest verified tarball of main.
name: Deploy website

on:
  workflow_run:
    workflows: [verify]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read # download the artifact of the verify run
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - id: run
        name: Pick the verify run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow verify --branch main --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: package
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}

      - name: Unpack the tested website
        run: |
          tar -xzf audio-tag-*.tgz
          test -f package/website/dist/index.html
          touch package/website/dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: package/website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
