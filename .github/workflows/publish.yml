# Publishes audio-tag to npm: verify.yml calls this workflow after `make verify` passes on a version tag
# (v0.1.0, v1.2.3, ...), and it publishes that run's `package` artifact, the tarball `make e2e` packed,
# installed and tested, as is: nothing is built or packed again.
# Release: bump "version" in package.json, commit, then `git tag v<version> && git push origin v<version>`.
# Needs the repository secret NPM_TOKEN: an npm access token that may publish this package.
name: Publish to npm

on:
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: true

permissions:
  contents: read
  id-token: write # npm provenance: links the published package to this workflow run

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          name: package

      - name: Check that the tag matches the tarball's version
        run: |
          version=$(tar -xzOf audio-tag-*.tgz package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the package version $version (expected v$version)"
            exit 1
          fi

      # --ignore-scripts: prepublishOnly would build again; `make verify` already ran its checks on this tarball
      # (typecheck, tests, build, platform check and size budgets, then e2e on the installed package).
      - name: Publish
        run: npm publish audio-tag-*.tgz --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
