# Publishes audio-tag to npm from the build that verify tested: verify.yml calls this workflow after `make
# verify` passes on a version tag (v0.1.0, v1.2.3, ...), and it publishes that run's `build` artifact (dist/ and
# website/dist/) instead of building again. `make e2e` packed and installed exactly this tree with `npm pack`.
# Release: bump "version" in package.json, commit, then `git tag v<version> && git push origin v<version>`.
# Needs the repository secret NPM_TOKEN: an npm access token that may publish this package.
name: Publish to npm

on:
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: true

permissions:
  contents: read
  id-token: write # npm provenance: links the published package to this workflow run

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          name: build

      - name: Check that the tag matches package.json and the build is complete
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version (expected v$version)"
            exit 1
          fi
          for f in dist/index.js dist/browser.min.js dist/build-info.json website/dist/index.html; do
            [ -f "$f" ] || { echo "::error::$f is missing from the verified build"; exit 1; }
          done

      # --ignore-scripts: prepublishOnly would build again (it starts by deleting dist/); `make verify` already
      # ran its checks on this tree: typecheck, tests, build, platform check and size budgets (make lint).
      - name: Publish
        run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
