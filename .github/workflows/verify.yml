# defuss-vae CI: the same verbs as local development, so CI cannot drift from `make verify`.
name: verify
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Official setup actions put uv/bun on PATH for every later step, whatever the project's `make setup` does;
      # each runs only when its lockfile exists, so a toolchain added later is picked up without editing this file.
      # mise installs every tool mise.toml pins (Go, Rust, JDK, .NET, linters) and puts its shims on PATH.
      - uses: jdx/mise-action@v5
        if: hashFiles('mise.toml', '.tool-versions') != ''
      # setup-uv publishes no major tags after v7, so pin its release commit as its README does.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: hashFiles('**/uv.lock') != ''
      - uses: oven-sh/setup-bun@v2
        if: hashFiles('**/bun.lock', '**/bun.lockb') != ''
      # CONFIG["ci"] commands from .agents/VERIFY.py, one step each:
      - run: make setup
      - run: make verify
      # The npm tarball make e2e packed, installed and drove in Chromium (tmp/e2e/, scripts/e2e.mjs): pages.yml
      # deploys its website/dist/ and publish.yml publishes it as is, so nothing is built or packed again.
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: tmp/e2e/audio-tag-*.tgz
          if-no-files-found: error
          retention-days: 7

  # A version tag publishes the tarball verify just tested (publish.yml); a failed verify publishes nothing.
  publish:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yml
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
